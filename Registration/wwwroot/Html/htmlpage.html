<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <table align="center" border="1" style="width:100%; border-collapse: collapse;" text-align: center;">

        <tr>
            <td colspan="8" style="height: 30px;"></td>
        </tr>

        <tr>
            <td style="width: 25%;"></td>
            <td style="width: 20%; font-weight: bold;">LOGO</td>
            <td style="width: 5%;">צור קשר</td>
            <td style="width: 5%;">תפריט</td>
            <td style="width: 5%;">אודות</td>
            <td style="width: 5%;">על הפרויקט</td>
            <td style="width: 3%;"></td>
            <td style="width: 25%;"></td>
        </tr>
    </table>
    <div style="background-color:#f7c3e1; border: 1px solid #ccc; text-align: center; padding: 15px; width: 100%; box-sizing: border-box;">
        <h2 style="color:hotpink; margin: 0;">דף הרשמה</h2>
    </div>

    <br />

    <!-- טבלה ראשית עבור טופס ההרשמה -->
    <table align="center" border="1" style="width: 100%; border-collapse: collapse; text-align: right; padding: 10px;">
        <tr>
            <table align="center" border="1" style="width: 100%; border-collapse: collapse; text-align: right; padding: 10px;">
                <tr>
                    <!-- טור שמאל: טלפון, תאריך לידה, מגדר, תקנון וכפתור Submit -->
                    <td style="width: 50%; vertical-align: top; padding: 10px;">
                        <table border="1" style="width: 100%; border-collapse: collapse;">
                            <!-- טלפון -->
                            <tr>
                                <td style="padding: 8px;">
                                    <input type="text" placeholder="טלפון נייד" style="width: 60%; text-align: right;">
                                    <select style="width: 30%;">
                                        <option>050</option>
                                        <option>051</option>
                                        <option>052</option>
                                        <option>053</option>
                                        <option>054</option>
                                        <option>055</option>
                                        <option>056</option>
                                        <option>057</option>
                                        <option>058</option>
                                    </select>
                                </td>
                                <td style="width: 15%; font-weight: bold; text-align: right; padding: 8px;">:טלפון</td>
                            </tr>
                            <!-- תאריך לידה -->
                            <tr>
                                <td style="padding: 8px;">
                                    <input type="date" id="uData" name="uData" style="width: 95%; text-align: right;" />
                                </td>
                                <td style="font-weight: bold; text-align: right; padding: 8px;">:תאריך לידה</td>
                            </tr>

</tr>
                            <!-- מגדר -->
                            <tr>
                                <td style="padding: 8px;">
                                    <label><input type="radio" name="gender" value="female"> נקבה</label>
                                    <label style="margin-right: 15px;"><input type="radio" name="gender" value="male"> זכר</label>
                                </td>
                                <td style="font-weight: bold; text-align: right; padding: 8px;">:מגדר</td>
                            </tr>
                            <!-- תקנון -->
                            <tr>
                                <td colspan="2" style="padding: 8px;">
                                    <input type="checkbox" id="terms">
                                    <label for="terms">נא לעיין בתקנון ולאשר את <a href="#">תנאי שימוש</a> באתר</label>
                                </td>
                            </tr>
                            <!-- כפתור שליחה -->
                            <tr>
                                <td colspan="2" style="padding: 10px; text-align: center;">
                                    <button type="submit" style="background-color: #4CAF50; color: white; border: none; padding: 10px 0; width: 100%; font-size: 16px; cursor: pointer;">Submit</button>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <!-- טור ימין: שם פרטי, שם משפחה, אימייל, סיסמה ואימות סיסמה -->
                    <td style="width: 50%; vertical-align: top; padding: 10px;">
                        <table border="1" style="width: 100%; border-collapse: collapse;">
                            <!-- שם פרטי -->
                            <tr>
                                <td style="padding: 8px;">
                                    <input type="text" placeholder="שם פרטי" style="width: 95%; text-align: right;">
                                </td>
                                <td style="width: 15%; font-weight: bold; text-align: right; padding: 8px;">:שם פרטי</td>
                            </tr>
                            <!-- שם משפחה -->
                            <tr>
                                <td style="padding: 8px;">
                                    <input type="text" placeholder="שם משפחה" style="width: 95%; text-align: right;">
                                </td>
                                <td style="font-weight: bold; text-align: right; padding: 8px;">:שם משפחה</td>
                            </tr>
                            <!-- Email -->
                            <tr>
                                <td style="padding: 8px;">
                                    <input type="email" placeholder="Email" style="width: 95%; text-align: right;">
                                </td>
                                <td style="font-weight: bold; text-align: right; padding: 8px;">:Email</td>
                            </tr>
                            <!-- סיסמא -->
                            <tr>
                                <td style="padding: 8px;">
                                    <input type="password" placeholder="סיסמא" style="width: 95%; text-align: right;"><br>
                                    <label style="font-size: 12px;"><input type="checkbox"> Show Password</label>
                                </td>
                                <td style="font-weight: bold; text-align: right; padding: 8px;">:סיסמא</td>
                            </tr>
                            <!-- אימות סיסמא -->
                            <tr>
                                <td style="padding: 8px;">
                                    <input type="password" placeholder="אימות סיסמא" style="width: 95%; text-align: right;">
                                </td>
                                <td style="font-weight: bold; text-align: right; padding: 8px; ">:אימות סיסמא</td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>

</body>
</html>
